# Golandia — распределённый монолит: frontend + backend + PostgreSQL + sandbox
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: golandia
      POSTGRES_PASSWORD: golandia
      POSTGRES_DB: golandia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golandia -d golandia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      COURSE_DATA_DIR: /app/data/lessons
      DATABASE_URL: postgres://golandia:golandia@postgres:5432/golandia?sslmode=disable
      SANDBOX_MODE: docker
      SANDBOX_IMAGE: go-llm-sandbox:latest
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend/data:/app/data:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

  sandbox:
    image: go-llm-sandbox:latest
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.sandbox
    command: ["sleep", "infinity"]

volumes:
  pgdata:
